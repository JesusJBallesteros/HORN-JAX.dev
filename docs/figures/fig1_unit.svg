<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica,Arial,sans-serif">
  <style>
    .t{font-size:15px;fill:#111}.s{font-size:12.5px;fill:#444}.m{font-size:13px;font-style:italic;fill:#111}
    .h{font-size:16px;font-weight:bold;fill:#111}.lbl{font-size:11.5px;fill:#555}
    .box{fill:#fff;stroke:#333;stroke-width:1.4}
    .osc{fill:#eaf2fb;stroke:#2c6fb5;stroke-width:1.6}
    .rnn{fill:#f4f4f4;stroke:#888;stroke-width:1.4}
    .ar{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>

  <text x="30" y="30" class="h">Figure 1. The unit: what replaces a neuron-like activation</text>

  <!-- standard RNN unit -->
  <text x="40" y="70" class="t" font-weight="bold">Standard recurrent unit</text>
  <rect x="40" y="82" width="330" height="120" rx="6" class="rnn"/>
  <text x="60" y="108" class="m">h  &#8592;  tanh(W h + W u)</text>
  <text x="60" y="132" class="s">ONE number of state per unit.</text>
  <text x="60" y="152" class="s">Nothing in it persists on its own, so memory</text>
  <text x="60" y="170" class="s">has to be added with learned gates (LSTM).</text>
  <text x="60" y="190" class="lbl">Memory is an engineering add-on.</text>

  <!-- HORN unit -->
  <text x="440" y="70" class="t" font-weight="bold">HORN unit</text>
  <rect x="440" y="82" width="420" height="120" rx="6" class="osc"/>
  <text x="460" y="110" class="m">x'' + 2&#950;&#969; x' + &#969;&#178; x  =  f(x, u)</text>
  <text x="460" y="134" class="s">TWO numbers of state: position x and velocity x'.</text>
  <text x="460" y="154" class="s">An underdamped oscillator rings, so persistence</text>
  <text x="460" y="172" class="s">is intrinsic. No gates required.</text>
  <text x="460" y="192" class="lbl">Memory is a property of the substrate.</text>

  <!-- term anatomy -->
  <text x="40" y="248" class="t" font-weight="bold">What each term does</text>
  <line x1="40" y1="258" x2="860" y2="258" stroke="#ccc"/>

  <rect x="40" y="272" width="185" height="86" rx="5" class="box"/>
  <text x="52" y="294" class="m">&#969;&#178; x</text>
  <text x="52" y="316" class="s">restoring force</text>
  <text x="52" y="334" class="s">the spring: pulls x back</text>
  <text x="52" y="350" class="lbl">sets WHICH frequency</text>

  <rect x="245" y="272" width="185" height="86" rx="5" class="box"/>
  <text x="257" y="294" class="m">2&#950;&#969; x'</text>
  <text x="257" y="316" class="s">damping / friction</text>
  <text x="257" y="334" class="s">opposes velocity, bleeds</text>
  <text x="257" y="350" class="lbl">sets HOW LONG it rings</text>

  <rect x="450" y="272" width="185" height="86" rx="5" class="box"/>
  <text x="462" y="294" class="m">f(x, u)</text>
  <text x="462" y="316" class="s">drive</text>
  <text x="462" y="334" class="s">afferent input + input</text>
  <text x="462" y="350" class="s">from other oscillators</text>

  <rect x="655" y="272" width="205" height="86" rx="5" class="box"/>
  <text x="667" y="294" class="m">state = (x, x')</text>
  <text x="667" y="316" class="s">read out as (x, x'/&#969;)</text>
  <text x="667" y="334" class="s">because x' ~ &#969;x: raw velocity</text>
  <text x="667" y="350" class="s">is ~600&#215; x at 100 Hz</text>

  <!-- learned vs fixed -->
  <text x="40" y="398" class="t" font-weight="bold">Free parameters of one unit</text>
  <rect x="40" y="410" width="820" height="44" rx="5" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.3"/>
  <text x="55" y="432" class="s"><tspan font-weight="bold">&#969;</tspan> natural frequency (log-stored)</text>
  <text x="255" y="432" class="s"><tspan font-weight="bold">&#950;</tspan> damping ratio (log-stored)</text>
  <text x="455" y="432" class="s"><tspan font-weight="bold">W_in</tspan> afferent weights</text>
  <text x="640" y="432" class="s"><tspan font-weight="bold">W_rec</tspan> coupling between units</text>
  <text x="55" y="448" class="lbl">&#969; and &#950; are stored as logarithms so that gradient descent cannot drive them negative. A negative &#950; is negative damping: exponential blow-up.</text>
</svg>

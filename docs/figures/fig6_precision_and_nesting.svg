<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica,Arial,sans-serif">
  <style>
    .t{font-size:13.5px;fill:#111}.s{font-size:12px;fill:#444}.lbl{font-size:11px;fill:#666}
    .h{font-size:16px;font-weight:bold;fill:#111}.m{font-size:12.5px;font-style:italic}
    .ar{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .osc{fill:#eaf2fb;stroke:#2c6fb5;stroke-width:1.5}
    .q{fill:#ffe9c7;stroke:#c98a20;stroke-width:1.5}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>

  <text x="30" y="28" class="h">Figure 6a. Two places to lose precision, and only one of them matters</text>

  <!-- in-loop -->
  <rect x="30" y="46" width="405" height="150" rx="8" fill="#fdeeee" stroke="#c05050" stroke-width="1.6"/>
  <text x="45" y="68" class="t" font-weight="bold">Rounding INSIDE the loop  (the analog case)</text>
  <rect x="45" y="82" width="86" height="34" rx="4" class="osc"/><text x="55" y="104" class="s">oscillator</text>
  <path d="M133,99 L163,99" class="ar"/>
  <rect x="165" y="82" width="80" height="34" rx="4" class="q"/><text x="176" y="104" class="s">round</text>
  <path d="M247,99 L277,99" class="ar"/>
  <text x="281" y="104" class="s">state at t+1</text>
  <path d="M300,116 L300,140 L88,140 L88,120" class="ar"/>
  <text x="120" y="157" class="lbl">the ROUNDED value carries forward, so error compounds</text>
  <text x="45" y="178" class="s">Error re-enters the dynamics. Trajectories decorrelate from the</text>
  <text x="45" y="192" class="s">full-precision run.</text>

  <!-- observation -->
  <rect x="460" y="46" width="405" height="150" rx="8" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.6"/>
  <text x="475" y="68" class="t" font-weight="bold">Rounding at OBSERVATION only  (a coarse digitiser)</text>
  <rect x="475" y="82" width="86" height="34" rx="4" class="osc"/><text x="485" y="104" class="s">oscillator</text>
  <path d="M563,99 L593,99" class="ar"/>
  <text x="597" y="104" class="s">state at t+1</text>
  <path d="M612,116 L612,140 L518,140 L518,120" class="ar"/>
  <text x="640" y="140" class="lbl">full-precision state carries forward</text>
  <path d="M700,99 L730,99" class="ar"/>
  <rect x="732" y="82" width="80" height="34" rx="4" class="q"/><text x="743" y="104" class="s">round</text>
  <text x="475" y="178" class="s">Rounding happens once, at the read. Summarising across the</text>
  <text x="475" y="192" class="s">sequence averages it away, as trial averaging does.</text>

  <rect x="30" y="208" width="835" height="86" rx="6" fill="#fff" stroke="#333" stroke-width="1.3"/>
  <text x="45" y="229" class="t" font-weight="bold">Measured (E06)</text>
  <text x="45" y="249" class="s">In-loop, digit task: the readout fitted at full precision collapses; a readout refitted on the degraded activity recovers <tspan font-weight="bold">0.308 &#8594; 0.696</tspan> at 3 bits.</text>
  <text x="45" y="267" class="s">Observation-only, single bit, refitted readout: <tspan font-weight="bold">0.826</tspan>. Nearly harmless.</text>
  <text x="45" y="286" class="s" font-weight="bold">Precision matters where the dynamics evolve, not where they are measured. So co-design the readout with the substrate.</text>

  <!-- inversion -->
  <rect x="30" y="306" width="835" height="74" rx="6" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.4"/>
  <text x="45" y="327" class="t" font-weight="bold">And the two codes fail in opposite directions, which inverted the prediction</text>
  <text x="45" y="347" class="s">Phase-coded task: readout needs <tspan font-weight="bold">14 bits</tspan>, but the information survives to <tspan font-weight="bold">3 bits</tspan> (refitted readout 1.000).</text>
  <text x="45" y="365" class="s">Digit task: readout recovers by <tspan font-weight="bold">6 bits</tspan>, but the information itself erodes (refitted 0.696 against 0.884 at full precision).</text>

  <text x="30" y="424" class="h">Figure 6b. The nested architecture (E07): four conditions, matched parameter count</text>

  <!-- conditions -->
  <g>
    <rect x="30" y="440" width="196" height="140" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.4"/>
    <text x="44" y="461" class="t" font-weight="bold">A  homogeneous</text>
    <circle cx="70" cy="492" r="13" class="osc"/><circle cx="105" cy="492" r="13" class="osc"/>
    <circle cx="140" cy="492" r="13" class="osc"/><circle cx="175" cy="492" r="13" class="osc"/>
    <text x="44" y="524" class="lbl">every unit the same &#969;</text>
    <text x="44" y="542" class="lbl">additive coupling only</text>
    <text x="44" y="566" class="lbl">the floor</text>
  </g>
  <g>
    <rect x="238" y="440" width="196" height="140" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.4"/>
    <text x="252" y="461" class="t" font-weight="bold">B  spread</text>
    <circle cx="278" cy="492" r="9" class="osc"/><circle cx="313" cy="492" r="15" class="osc"/>
    <circle cx="348" cy="492" r="11" class="osc"/><circle cx="383" cy="492" r="17" class="osc"/>
    <text x="252" y="524" class="lbl">unstructured heterogeneity</text>
    <text x="252" y="542" class="lbl">additive coupling only</text>
    <text x="252" y="566" class="lbl">what is published today</text>
  </g>
  <g>
    <rect x="446" y="440" width="196" height="140" rx="6" fill="#eaf2fb" stroke="#2c6fb5" stroke-width="1.6"/>
    <text x="460" y="461" class="t" font-weight="bold">C  banded</text>
    <ellipse cx="500" cy="490" rx="34" ry="17" fill="#fff" stroke="#2c6fb5"/><text x="482" y="494" class="lbl">slow f</text>
    <ellipse cx="590" cy="490" rx="34" ry="17" fill="#fff" stroke="#2c6fb5"/><text x="570" y="494" class="lbl">fast 6f</text>
    <text x="460" y="524" class="lbl">fixed near-integer ratio</text>
    <text x="460" y="542" class="lbl">additive coupling only</text>
    <text x="460" y="566" class="lbl">C vs B isolates STRUCTURE</text>
  </g>
  <g>
    <rect x="654" y="440" width="211" height="140" rx="6" fill="#e9f5e9" stroke="#4a8f4a" stroke-width="1.8"/>
    <text x="668" y="461" class="t" font-weight="bold">D  banded + gate</text>
    <ellipse cx="706" cy="490" rx="32" ry="17" fill="#fff" stroke="#4a8f4a"/><text x="690" y="494" class="lbl">slow f</text>
    <ellipse cx="800" cy="490" rx="32" ry="17" fill="#fff" stroke="#4a8f4a"/><text x="782" y="494" class="lbl">fast 6f</text>
    <path d="M739,483 C760,466 772,466 790,479" stroke="#c05050" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="726" y="459" class="lbl" fill="#c05050"></text>
    <text x="668" y="524" class="lbl">slow PHASE multiplies fast GAIN</text>
    <text x="668" y="542" class="lbl">one extra number per band pair</text>
    <text x="668" y="566" class="lbl">D vs C isolates the MODULATION</text>
  </g>
</svg>
